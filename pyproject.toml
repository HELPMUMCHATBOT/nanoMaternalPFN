[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanomaternalpfn"
version = "0.1.0"
description = "Research-only missingness-aware maternal tabular PFN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.4", "h5py>=3.9", "pyyaml>=6"]

[project.optional-dependencies]
edge = ["onnx>=1.16", "onnxruntime>=1.18", "psutil>=5.9"]
boosting = ["xgboost>=2", "lightgbm>=4"]
paper = ["xgboost>=2,<4", "lightgbm>=4,<5", "tabpfn>=9,<10", "onnx>=1.16", "onnxruntime>=1.18", "psutil>=5.9"]
test = ["pytest>=8"]
data = ["ucimlrepo>=0.0.7", "boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]
