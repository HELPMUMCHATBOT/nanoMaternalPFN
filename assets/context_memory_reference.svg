<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
<rect width="1000" height="420" fill="#ffffff"/>
<g font-family="Arial,sans-serif" fill="#1a2840">
<text x="40" y="45" font-size="25" font-weight="bold">Context size vs. peak memory — reference only</text>
<text x="40" y="75" font-size="16">Illustrative prior figures supplied for nanoMaternalPFN; not independently reproduced</text>
</g>
<line x1="100" y1="330" x2="930" y2="330" stroke="#555" stroke-width="2"/>
<line x1="100" y1="100" x2="100" y2="330" stroke="#555" stroke-width="2"/>
<g stroke="#ddd" stroke-dasharray="4 6"><line x1="100" y1="270" x2="930" y2="270"/><line x1="100" y1="210" x2="930" y2="210"/><line x1="100" y1="150" x2="930" y2="150"/></g>
<g fill="#345" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><text x="200" y="356">16</text><text x="335" y="356">32</text><text x="470" y="356">64</text><text x="605" y="356">128</text><text x="740" y="356">256</text><text x="875" y="356">512</text><text x="520" y="390">Labeled context rows</text></g>
<polyline points="200,276 335,274" stroke="#18bfd7" stroke-width="5" fill="none"/>
<polyline points="200,270 335,268" stroke="#75a8fd" stroke-width="5" fill="none"/>
<g fill="#18bfd7"><circle cx="200" cy="276" r="7"/><circle cx="335" cy="274" r="7"/></g>
<g fill="#75a8fd"><circle cx="200" cy="270" r="7"/><circle cx="335" cy="268" r="7"/></g>
<g fill="#1a2840" font-family="Arial,sans-serif" font-size="16">
<text x="390" y="160" font-weight="bold">Provided example at N=32:</text>
<text x="390" y="190">INT8 + KV cache: 17.0 MB</text>
<text x="390" y="218">FP32 + KV cache: 19.1 MB</text>
<text x="390" y="246">FP32 recompute: 18.8 MB</text>
<text x="390" y="290">These are reference values, not benchmark outputs.</text>
</g>
<g fill="#455" font-family="Arial,sans-serif" font-size="14" text-anchor="end"><text x="89" y="330">0 MB</text><text x="89" y="270">15 MB</text><text x="89" y="210">30 MB</text><text x="89" y="150">45 MB</text></g>
</svg>