<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="630" viewBox="0 0 1060 630" role="img" aria-labelledby="heading desc">
<title id="heading">nanoMaternalPFN v2 inference architecture, derived from model.py</title>
<desc id="desc">Context-only normalization, missingness and target encoding, repeated feature and patient attention, and query-label decoder.</desc>
<rect x="0" y="0" width="1060" height="630" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#333" stroke-width="1.5"/></marker></defs>
<rect x="120" y="45" width="820" height="78" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="1.2"/>
<text x="146" y="75" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="#111">Frozen context and queries</text>
<text x="146" y="102" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">X: context rows plus query rows; y known for context only</text>
<path d="M530 126 L530 146" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120" y="154" width="820" height="78" rx="8" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="146" y="184" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="#111">Context-only input encoding</text>
<text x="146" y="211" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">Per-feature normalization from context; missing-value indicators</text>
<path d="M530 235 L530 255" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120" y="263" width="820" height="78" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="1.2"/>
<text x="146" y="293" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="#111">Feature and target tokens</text>
<text x="146" y="320" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">Projected value+missingness; context one-hot and query class prior</text>
<path d="M530 344 L530 364" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120" y="372" width="820" height="78" rx="8" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="146" y="402" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="#111">Repeated bidirectional-attention blocks</text>
<text x="146" y="429" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">Feature self-attention within row; patient queries attend to context keys/values; MLP</text>
<path d="M530 453 L530 473" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120" y="481" width="820" height="78" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="1.2"/>
<text x="146" y="511" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="#111">Query-label decoder</text>
<text x="146" y="538" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">v2 affine-free LayerNorm; query target token; classification logits</text>
<text x="530" y="610" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#555">Source: src/nanomaternalpfn/model.py (pre_ln_v2). Research architecture schematic; not a measured result.</text>
</svg>
