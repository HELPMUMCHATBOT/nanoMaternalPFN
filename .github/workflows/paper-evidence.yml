name: Paper evidence checks
on:
  push:
    paths:
      - 'scripts/paper/**'
      - 'docs/paper/**'
      - 'tests/test_paper_evidence_pipeline.py'
      - '.github/workflows/paper-evidence.yml'
  pull_request:
    paths:
      - 'scripts/paper/**'
      - 'docs/paper/**'
      - 'tests/test_paper_evidence_pipeline.py'
      - '.github/workflows/paper-evidence.yml'
jobs:
  evidence-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_paper_evidence_pipeline.py
